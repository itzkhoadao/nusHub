version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      client-minor-and-patch:
        update-types: [minor, patch]
    # TypeScript major upgrades require a coordinated typescript-eslint upgrade.
    # Keep patch/minor updates automatic; review majors once the tooling supports them.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps(client)

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps(server)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
