name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_FETCH_RETRIES: "3"

jobs:
  server:
    name: CI / Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://test:test@localhost:5432/nushub_test
      JWT_SECRET: ci-only-secret-that-is-never-used-in-production
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          cache-dependency-path: server/package-lock.json
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Lint server
        run: npm run lint

      - name: Test server
        run: npm test

      - name: Build server
        run: npm run build

      - name: Audit all server dependencies
        run: npm audit --audit-level=high

      - name: Package server build
        if: github.event_name == 'push'
        run: |
          tar --create --gzip --file ../server-build.tgz dist package.json package-lock.json
          sha256sum ../server-build.tgz > ../server-build.tgz.sha256

      - name: Upload server build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-build-${{ github.sha }}
          path: |
            server-build.tgz
            server-build.tgz.sha256
          if-no-files-found: error
          retention-days: 14

  client:
    name: CI / Client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    env:
      VITE_API_URL: http://localhost:5000

    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          cache-dependency-path: client/package-lock.json
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Lint client
        run: npm run lint

      - name: Build client
        run: npm run build

      - name: Audit all client dependencies
        run: npm audit --audit-level=high

      - name: Package client build
        if: github.event_name == 'push'
        run: |
          tar --create --gzip --file ../client-build.tgz dist
          sha256sum ../client-build.tgz > ../client-build.tgz.sha256

      - name: Upload client build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-build-${{ github.sha }}
          path: |
            client-build.tgz
            client-build.tgz.sha256
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: CI / Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0

  secret-scan:
    name: CI / Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan changed commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  required:
    name: CI / Required
    if: always()
    needs: [server, client, dependency-review, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce every required result
        if: >-
          needs.server.result != 'success' ||
          needs.client.result != 'success' ||
          needs.secret-scan.result != 'success' ||
          (needs.dependency-review.result != 'success' &&
          needs.dependency-review.result != 'skipped')
        run: exit 1

      - name: Confirm delivery gate
        run: echo "All required CI checks passed."
